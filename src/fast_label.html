<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast labelling · Spotify support</title>
<style>
  :root { color-scheme: light; --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781; --border:rgba(11,11,11,.12); --accent:#2a78d6; --accent-wash:rgba(42,120,214,.12); --warn:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781; --border:rgba(255,255,255,.12); --accent:#3987e5; --accent-wash:rgba(57,135,229,.18); --warn:#e66767; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .progress { flex: 1 1 260px; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; background: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .ctx { white-space: pre-wrap; color: var(--muted); font-size: 13px; margin: 0 0 10px; max-height: 220px; overflow: auto; }
  .msg { font-size: 18px; line-height: 1.45; margin: 0; }
  .reply { font-size: 16px; line-height: 1.45; margin: 0; border-left: 3px solid var(--accent); padding-left: 12px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  h3:first-child { margin-top: 0; }
  .opts { display: grid; gap: 6px; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  button.opt { display: flex; gap: 10px; align-items: baseline; text-align: left; font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
  button.opt kbd { font: 12px ui-monospace, monospace; color: var(--muted); min-width: 1.2em; }
  button.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); }
  button.opt[disabled] { opacity: .45; cursor: default; }
  .def { font-size: 13px; color: var(--ink-2); margin: 8px 0 0; min-height: 3em; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
  input[type=text] { flex: 1 1 200px; font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--page); color: var(--ink); }
  .save { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 16px; background: var(--accent); color: #fff; cursor: pointer; }
  .flash { color: var(--warn); font-size: 14px; min-height: 1.5em; margin-top: 8px; }
  details { margin-top: 16px; font-size: 13px; color: var(--ink-2); }
  details li { margin-bottom: 4px; }
  pre { white-space: pre-wrap; font: 13px/1.5 system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="progress"><div id="progress-text"></div><div class="bar"><div id="progress-bar" style="width:0"></div></div></div>
    <div class="hint" id="hint"></div>
  </div>
  <div id="app" class="grid"></div>
  <details><summary id="rules-title">Codebook rules and definitions</summary><div id="rules"></div></details>
</div>
<script>
(() => {
  const task = new URLSearchParams(location.search).get("task") || "golden";
  const rating = task === "rate";
  const OVERALL = ["Harmful", "Poor", "Partial", "Good", "Send as-is"];
  let S, idx = 0, draft;
  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs = {}, text) => { const n = document.createElement(tag); Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v)); if (text != null) n.textContent = text; return n; };
  const keyOf = (item) => (rating ? item.item_id : item.conv_id);

  function firstUnlabelled(start) {
    for (let k = 0; k < S.items.length; k++) { const i = (start + k) % S.items.length; if (!S.labels[keyOf(S.items[i])]) return i; }
    return Math.min(start, S.items.length - 1);
  }
  function open(i) {
    idx = (i + S.items.length) % S.items.length;
    const prev = S.labels[keyOf(S.items[idx])];
    if (rating) {
      draft = prev ? { overall: Number(prev.overall), hallucination: prev.hallucination, notes: prev.notes || "" } : { overall: null, hallucination: "no", notes: "" };
    } else {
      draft = prev
        ? { intent: prev.intent, human: prev.should_escalate, reason: prev.escalation_reason === "none" ? null : prev.escalation_reason, unsure: String(prev.unsure) === "True", notes: prev.notes || "" }
        : { intent: null, human: "no", reason: null, unsure: false, notes: "" };
    }
    render("");
  }
  function optButton(key, label, pressed, onClick, disabled) {
    const b = el("button", { type: "button", class: "opt", "aria-pressed": String(pressed) });
    if (disabled) b.disabled = true;
    b.append(el("kbd", {}, key), el("span", {}, label));
    b.addEventListener("click", onClick);
    return b;
  }
  function footer(right, flash) {
    const row = el("div", { class: "row" });
    if (!rating) row.append(optButton("U", "Unsure", draft.unsure, () => { draft.unsure = !draft.unsure; render(""); }));
    const notes = el("input", { type: "text", placeholder: "Notes (optional)", id: "notes" });
    notes.value = draft.notes;
    notes.addEventListener("input", () => { draft.notes = notes.value; });
    const save = el("button", { type: "button", class: "save" }, "Save & next ⏎");
    save.addEventListener("click", saveCurrent);
    row.append(notes, save);
    right.append(row, el("div", { class: "flash" }, flash));
  }
  function render(flash) {
    const done = S.items.filter((it) => S.labels[keyOf(it)]).length;
    const title = rating ? "Reply ratings (blind)" : task === "relabel" ? "Blind re-label" : "Golden labels";
    $("#progress-text").textContent = `${title} · ${done} / ${S.items.length} done · item ${idx + 1}${S.labels[keyOf(S.items[idx])] ? " (saved, editable)" : ""}`;
    $("#progress-bar").style.width = `${(100 * done) / S.items.length}%`;
    const item = S.items[idx];

    const left = el("div", { class: "card" });
    if (item.context) left.append(el("h3", {}, "Earlier in the thread"), el("p", { class: "ctx" }, item.context));
    left.append(el("h3", {}, "Customer's latest message"), el("p", { class: "msg" }, item.customer_text));
    if (rating) left.append(el("h3", {}, "Candidate reply (which system wrote it is hidden)"), el("p", { class: "reply" }, item.reply || "(empty)"));

    const right = el("div", { class: "card" });
    if (rating) {
      right.append(el("h3", {}, "Overall: would a support lead send this?"));
      const overall = el("div", { class: "opts" });
      OVERALL.forEach((name, n) => overall.append(optButton(String(n + 1), name, draft.overall === n + 1, () => { draft.overall = n + 1; render(""); })));
      right.append(overall);
      right.append(el("h3", {}, "Hallucination? (invented policy, feature, link, price or promise)"));
      const hall = el("div", { class: "opts two" });
      hall.append(optButton("N", "No", draft.hallucination === "no", () => { draft.hallucination = "no"; render(""); }));
      hall.append(optButton("Y", "Yes", draft.hallucination === "yes", () => { draft.hallucination = "yes"; render(""); }));
      right.append(hall);
    } else {
      right.append(el("h3", {}, "Intent"));
      const intents = el("div", { class: "opts" });
      S.intents.forEach((it, n) => intents.append(optButton(String(n + 1), it.name, draft.intent === it.id, () => { draft.intent = it.id; render(""); })));
      right.append(intents);
      const chosen = S.intents.find((it) => it.id === draft.intent);
      right.append(el("p", { class: "def" }, chosen ? chosen.definition : "Pick the intent the customer most needs resolved."));
      right.append(el("h3", {}, "Should a human handle this?"));
      const human = el("div", { class: "opts two" });
      human.append(optButton("N", "No", draft.human === "no", () => { draft.human = "no"; draft.reason = null; render(""); }));
      human.append(optButton("Y", "Yes", draft.human === "yes", () => { draft.human = "yes"; render(""); }));
      right.append(human);
      right.append(el("h3", {}, "Reason (if yes)"));
      const reasons = el("div", { class: "opts two" });
      S.reasons.forEach((r, n) => reasons.append(optButton("ABCDEF"[n], r.id.replaceAll("_", " "), draft.reason === r.id, () => { draft.human = "yes"; draft.reason = r.id; render(""); }, draft.human !== "yes")));
      right.append(reasons);
    }
    footer(right, flash);
    $("#app").replaceChildren(left, right);
  }
  async function post(url, body) {
    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const out = await res.json();
      return out.ok ? null : out.error || "Save failed.";
    } catch (e) { return "Save failed: is fast_label.py still running? Press Enter to retry."; }
  }
  async function saveCurrent() {
    const item = S.items[idx];
    let error, saved;
    if (rating) {
      if (!draft.overall) return render("Pick an overall score first (1–5).");
      saved = { overall: draft.overall, hallucination: draft.hallucination, notes: draft.notes };
      error = await post("/api/rating", { item_id: item.item_id, ...saved });
    } else {
      if (!draft.intent) return render("Pick an intent first (1–9).");
      if (draft.human === "yes" && !draft.reason) return render("Pick a reason (A–F), or press N.");
      if ((S.always_escalate || []).includes(draft.intent) && draft.human !== "yes") return render("Codebook rule: this intent always needs a human. Press Y and pick a reason.");
      const body = { conv_id: item.conv_id, intent: draft.intent, should_escalate: draft.human, escalation_reason: draft.reason || "none", unsure: draft.unsure, notes: draft.notes };
      error = await post(`/api/label?task=${task}`, body);
      saved = { intent: body.intent, should_escalate: body.should_escalate, escalation_reason: body.escalation_reason, unsure: body.unsure ? "True" : "False", notes: body.notes };
    }
    if (error) return render(error);
    S.labels[keyOf(item)] = saved;
    open(firstUnlabelled(idx + 1));
  }
  document.addEventListener("keydown", (e) => {
    if (!S || !S.items) return;
    if (e.target.id === "notes") { if (e.key === "Enter") saveCurrent(); if (e.key === "Escape") e.target.blur(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (rating && /^[1-5]$/.test(k)) { draft.overall = Number(k); render(""); }
    else if (rating && (k === "y" || k === "n")) { draft.hallucination = k === "y" ? "yes" : "no"; render(""); }
    else if (!rating && /^[1-9]$/.test(k) && S.intents[Number(k) - 1]) { draft.intent = S.intents[Number(k) - 1].id; render(""); }
    else if (!rating && k === "n") { draft.human = "no"; draft.reason = null; render(""); }
    else if (!rating && k === "y") { draft.human = "yes"; render(""); }
    else if (!rating && k.length === 1 && "abcdef".includes(k) && S.reasons["abcdef".indexOf(k)]) { draft.human = "yes"; draft.reason = S.reasons["abcdef".indexOf(k)].id; render(""); }
    else if (!rating && k === "u") { draft.unsure = !draft.unsure; render(""); }
    else if (k === "enter") saveCurrent();
    else if (k === "arrowright") open(idx + 1);
    else if (k === "arrowleft") open(idx - 1);
    else if (k === "g") { const n = Number(prompt(`Go to item (1–${S.items.length})`)); if (n >= 1 && n <= S.items.length) open(n - 1); }
    else return;
    e.preventDefault();
  });
  async function load() {
    $("#hint").textContent = rating
      ? "1–5 overall · Y/N hallucination · Enter save & next · ←/→ move · G go to item"
      : "1–9 intent · Y/N human · A–F reason · U unsure · Enter save & next · ←/→ move · G go to item";
    S = await (await fetch(`/api/state?task=${task}`)).json();
    if (S.error) { $("#app").replaceChildren(el("div", { class: "card" }, S.error)); return; }
    if (rating) {
      $("#rules-title").textContent = "Rating rubric (same one the LLM judge uses)";
      $("#rules").replaceChildren(el("pre", {}, S.rubric));
    } else {
      const rules = el("ul");
      S.rules.forEach((r) => rules.append(el("li", {}, r)));
      S.intents.forEach((it, n) => rules.append(el("li", {}, `${n + 1}. ${it.name}: ${it.definition}`)));
      S.reasons.forEach((r, n) => rules.append(el("li", {}, `${"ABCDEF"[n]}. ${r.id}: ${r.definition}`)));
      $("#rules").replaceChildren(rules);
    }
    open(firstUnlabelled(0));
  }
  load();
})();
</script>
</body>
</html>
